#:schema https://json.schemastore.org/air.json

root = "."
tmp_dir = "bin"

[build]
cmd = "go build -o ./bin/main.exe ./cmd/api"
bin = "./bin/main.exe"
full_bin = "./bin/main.exe"

include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "bin", "vendor", "testdata", "web", "docs", "scripts"]
exclude_regex = ["_test.go"]

delay = 1000
stop_on_error = true
send_interrupt = false
kill_delay = "0s"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = false

[misc]
clean_on_exit = true